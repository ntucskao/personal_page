<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubuntu 10小時從零開始實戰課</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
        }
        .ubuntu-gradient {
            background: linear-gradient(135deg, #84CC16 0%, #0EA5E9 100%);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar-link.active {
            border-left: 4px solid #84CC16;
            background: rgba(132, 204, 22, 0.1);
            color: #84CC16;
        }
        .step-num {
            font-family: 'Poppins', sans-serif;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #84CC16; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-80 glass-card fixed h-screen hidden lg:flex flex-col border-r border-slate-800">
        <div class="p-6 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 ubuntu-gradient rounded-lg flex items-center justify-center text-slate-900 shadow-lg shadow-lime-500/20">
                    <i class="fa-brands fa-ubuntu text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-black text-xl tracking-tight">Ubuntu 10H</h1>
                    <p class="text-xs text-slate-400">從小白到工程師的進階路</p>
                </div>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto p-4 space-y-2" id="sidebarNav">
            <!-- Sidebar links will be generated by JS -->
        </nav>
        <div class="p-6 border-t border-slate-800 text-center">
            <p class="text-xs text-slate-500">© 2026 高老師 feat. 聯成電腦菜鳥救星</p>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 lg:ml-80 p-6 lg:p-12">
        <!-- Header Section -->
        <header class="mb-12">
            <div class="inline-block px-3 py-1 bg-lime-500/10 text-lime-400 text-sm font-bold rounded-full mb-4">
                新手友善課程系統
            </div>
            <h2 class="text-4xl lg:text-6xl font-black mb-6">掌握 Linux 的靈魂</h2>
            <p class="text-slate-400 max-w-2xl text-lg leading-relaxed">
                這不是枯燥的理論課，而是為期 10 小時的沉浸式實戰。我們將從安裝系統開始，一步步帶領你進入伺服器管理、自動化腳本與現代容器化技術的世界。
            </p>
            
            <div class="mt-8 flex flex-wrap gap-4">
                <div class="px-6 py-4 glass-card rounded-2xl flex items-center gap-4">
                    <div class="text-3xl font-black text-lime-500 step-num">10</div>
                    <div class="text-sm text-slate-400 leading-tight">實戰<br>小時</div>
                </div>
                <div class="px-6 py-4 glass-card rounded-2xl flex items-center gap-4">
                    <div class="text-3xl font-black text-sky-500 step-num">15+</div>
                    <div class="text-sm text-slate-400 leading-tight">雙手<br>實作</div>
                </div>
                <div class="px-6 py-4 glass-card rounded-2xl flex items-center gap-4">
                    <div class="text-3xl font-black text-purple-500 step-num">∞</div>
                    <div class="text-sm text-slate-400 leading-tight">終身<br>技能</div>
                </div>
            </div>
        </header>

        <!-- Course Sections Container -->
        <div id="courseContainer" class="space-y-16">
            <!-- Course Sections will be injected here -->
        </div>
    </main>

    <script>
        const courseData = [
            {
                id: 1,
                title: "認識 Linux 與 Ubuntu",
                desc: "Linux 是什麼？與 Windows/macOS 有何不同？學習版本命名規則與環境搭建。",
                items: ["Linux 發行版介紹（Debian、Ubuntu、Fedora 等）", "Ubuntu 的版本與命名規則（LTS vs 一般版）", "安裝方式選擇：實體機、虛擬機、WSL"],
                practice: "實作：安裝VM+ Ubuntu 24.04 LTS",
                icon: "fa-linux",
                color: "lime"
            },
            {
                id: 2,
                title: "桌面環境與基本操作",
                desc: "熟悉 GNOME 桌面，解決中文輸入法與系統優化等初步問題。",
                items: ["GNOME 桌面介紹（應用程式列、檔案管理員）", "軟體中心安裝應用程式", "系統設定：語言、時區、螢幕"],
                practice: "實作：安裝常用軟體（VLC、LibreOffice）",
                icon: "fa-desktop",
                color: "sky"
            },
            {
                id: 3,
                title: "Terminal 初體驗",
                desc: "進入 Linux 的靈魂中心。理解為什麼指令比滑鼠更強大。",
                items: ["開啟 Terminal 的方式", "基本概念：提示字元、指令結構", "第一批指令：pwd、ls、cd、clear"],
                practice: "實作：用指令瀏覽整個檔案系統",
                icon: "fa-terminal",
                color: "purple"
            },
            {
                id: 4,
                title: "檔案與目錄操作",
                desc: "掌握 Linux 的路徑邏輯，學習如何高效管理檔案。",
                items: ["Linux 目錄結構深度解析", "絕對路徑 vs 相對路徑", "常用指令：mkdir、touch、cp、mv、rm"],
                practice: "實作：建立一套練習用的資料夾結構並操作",
                icon: "fa-folder-open",
                color: "amber"
            },
            {
                id: 5,
                title: "查看與編輯文字檔案",
                desc: "伺服器管理的核心：編輯設定檔。學習 Nano 與 Vim 編輯器。",
                items: ["查看檔案：cat、less、tail", "文字編輯器：nano 與 vim 基礎", "重導向與管線：>、>>、|"],
                practice: "實作：建立、寫入、搜尋文字檔案",
                icon: "fa-file-lines",
                color: "rose"
            },
            {
                id: 6,
                title: "使用者與權限管理",
                desc: "Linux 最強大的安全機制：rwx 權限與 sudo 管理員權限。",
                items: ["Linux 使用者概念：一般使用者 vs root", "sudo 的用法與安全性", "檔案權限：數字表示法（755、644）"],
                practice: "實作：建立新使用者，設定不同權限並測試",
                icon: "fa-user-shield",
                color: "emerald"
            },
            {
                id: 7,
                title: "軟體套件管理",
                desc: "學習使用 APT 套件系統，理解 Snap 與 Flatpak 的區別。",
                items: ["APT 指令集：update、upgrade、install", "搜尋與移除套件技巧", "Snap 套件簡介"],
                practice: "實作：安裝、更新、移除多個套件",
                icon: "fa-box-open",
                color: "cyan"
            },
            {
                id: 8,
                title: "程序管理與系統監控",
                desc: "當系統卡定時怎麼辦？學會監控資源與終止程序。",
                items: ["ps、top、htop 監控程序", "前景 vs 背景執行：&、fg、bg", "終止程序：kill、killall"],
                practice: "實作：模擬程序卡死，用指令強制終止",
                icon: "fa-microchip",
                color: "indigo"
            },
            {
                id: 9,
                title: "Docker 容器化入門",
                desc: "學習現代開發必備的容器技術。不弄髒系統也能跑起各種服務。",
                items: ["什麼是 Docker？虛擬機 vs 容器", "安裝 Docker Engine 與權限設定", "常用指令：docker pull、run、ps、stop"],
                practice: "實作：一鍵啟動 Nginx 伺服器與個人 Wiki",
                icon: "fa-box",
                color: "blue"
            },
            {
                id: 10,
                title: "Shell Script 入門",
                desc: "自動化你的工作！編寫第一個 Bash 腳本來執行重複任務。",
                items: ["Shell Script 結構：#!/bin/bash", "變數、條件判斷與迴圈", "自動化備份概念"],
                practice: "實作：寫一個自動整理檔案的小腳本",
                icon: "fa-code",
                color: "lime"
            }
        ];

        const container = document.getElementById('courseContainer');
        const sidebar = document.getElementById('sidebarNav');

        courseData.forEach((course, index) => {
            // Sidebar Navigation
            const navLink = document.createElement('a');
            navLink.href = `#hour${course.id}`;
            navLink.className = `sidebar-link block p-3 rounded-lg text-slate-400 hover:text-white transition-all flex items-center gap-3 ${index === 0 ? 'active' : ''}`;
            navLink.innerHTML = `<span class="step-num text-xs opacity-50 w-4">${course.id}</span> ${course.title}`;
            sidebar.appendChild(navLink);

            // Course Card
            const section = document.createElement('section');
            section.id = `hour${course.id}`;
            section.className = "scroll-mt-10";
            section.innerHTML = `
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-12 h-12 rounded-xl bg-${course.color}-500/20 text-${course.color}-400 flex items-center justify-center text-xl">
                        <i class="fa-solid ${course.icon}"></i>
                    </div>
                    <div>
                        <span class="text-xs font-bold text-${course.color}-500 uppercase tracking-widest">Hour ${course.id}</span>
                        <h3 class="text-2xl font-black">${course.title}</h3>
                    </div>
                </div>
                
                <div class="grid lg:grid-cols-2 gap-8">
                    <div class="glass-card p-8 rounded-3xl">
                        <h4 class="text-lg font-bold mb-4 text-slate-200">教學重點</h4>
                        <p class="text-slate-400 mb-6 text-sm">${course.desc}</p>
                        <ul class="space-y-3">
                            ${course.items.map(item => `
                                <li class="flex items-start gap-3 text-slate-300">
                                    <i class="fa-solid fa-check-circle text-${course.color}-500 mt-1"></i>
                                    <span>${item}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                    
                    <div class="bg-slate-900/50 border border-slate-800 p-8 rounded-3xl relative overflow-hidden flex flex-col justify-center">
                        <div class="absolute top-0 right-0 p-4 opacity-10 text-6xl">
                            <i class="fa-solid fa-flask"></i>
                        </div>
                        <h4 class="text-lg font-bold mb-4 text-lime-400">實作環節</h4>
                        <div class="bg-slate-950 p-6 rounded-xl font-mono text-sm border border-slate-800 text-slate-300">
                            ${course.practice}
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(section);
        });

        // Simple scroll spy for active navigation
        window.addEventListener('scroll', () => {
            const sections = document.querySelectorAll('section');
            const navLinks = document.querySelectorAll('.sidebar-link');
            
            let current = "";
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (window.pageYOffset >= sectionTop - 150) {
                    current = section.getAttribute('id');
                }
            });

            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href').includes(current)) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
